name: Build HoangHa Aimbot TIPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        sudo ln -s /opt/theos /theos

    - name: Build app
      run: |
        export THEOS=/opt/theos
        make package
        make package FINALPACKAGE=1

    - name: Convert to TIPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find . -path "*/_/HoangHaAimbot.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find /tmp -name "HoangHaAimbot.app" -type d 2>/dev/null | head -1)
        fi
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find . -name "*.app" -type d | head -1)
        fi
        echo "App found at: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          cp -r "$APP_PATH" Payload/
          cd Payload && zip -r ../HoangHaAimbot.tipa HoangHaAimbot.app && cd ..
        else
          echo "No .app found, trying to extract from .deb"
          DEB_FILE=$(find packages -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            mkdir -p deb_extract
            dpkg-deb -x "$DEB_FILE" deb_extract/
            find deb_extract -name "*.app" -type d | head -1
          fi
        fi
        ls -la HoangHaAimbot.tipa 2>/dev/null || echo "No tipa generated"

    - name: Upload .tipa
      uses: actions/upload-artifact@v4
      with:
        name: hoangha-aimbot
        path: HoangHaAimbot.tipa
